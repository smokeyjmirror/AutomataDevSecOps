services:
  postgres:
    image: postgres:16-alpine
    container_name: automata-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: SecurePassword123!
      POSTGRES_DB: automata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d automata"]
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: automata-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: automata-kafka
    depends_on:
      - zookeeper
    environment:
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 3
    ports:
      - "9092:9092"

  api:
    build: ./api
    container_name: automata-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://app_user:SecurePassword123!@postgres:5432/automata
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "5000:5000"
    depends_on:
      - postgres
      - kafka

  worker:
    build: ./worker
    container_name: automata-worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://app_user:SecurePassword123!@postgres:5432/automata
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      - postgres
      - kafka

  client-ui:
    image: python:3.12-slim
    container_name: automata-client-ui
    working_dir: /app
    volumes:
      - ./client-ui:/app
    command: python -m http.server 8000 --bind 0.0.0.0
    ports:
      - "8000:8000"

  admin-ui:
    image: python:3.12-slim
    container_name: automata-admin-ui
    working_dir: /app
    volumes:
      - ./admin-ui:/app
    command: python -m http.server 8001 --bind 0.0.0.0
    ports:
      - "8001:8001"

volumes:
  postgres_data:
